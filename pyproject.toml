[project]
name = "dvlt-slam"
version = "0.1.0"
description = "Deja View (DVLT) as the submap backbone for VGGT-SLAM 2.0"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# External dependencies of the combined DVLT + VGGT-SLAM environment, pinned to the
# versions that produced the results in report/. This project itself is locked as
# an editable entry, so `uv sync` installs vggt_slam + evals. The three OTHER local
# packages -- the dvlt submodule and third_party/{salad,vggt} -- are deliberately
# absent: they are upstream working trees, not portably lockable. Install them
# after `uv sync`, with --no-deps.
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "accelerate==1.8.1",
    "h5py==3.16.0",
    "huggingface-hub==1.16.4",
    "hydra-core==1.3.2",
    "numpy==2.4.4",
    "omegaconf==2.3.0",
    "opencv-python==4.11.0.86",
    "pillow==11.2.1",
    "pydantic==2.12.4",
    "safetensors==0.5.3",
    "scipy==1.16.0",
    "tqdm==4.67.1",
    "rich==14.3.3",
    "tensorboard==2.19.0",
    "wandb==0.25.1",
    "matplotlib==3.10.3",
    "plotly==6.2.0",
    "rerun-sdk==0.24.1",
    "open3d==0.19.0",
    "einops==0.8.2",
    "pytorch-metric-learning==2.9.0",
    "pytorch-lightning==2.6.6",
    "termcolor==3.3.0",
    "gradio==6.26.0",
    "viser==0.2.23",
    "requests==2.34.2",
    "trimesh==5.1.0",
    "lz4==4.4.5",
    "gtsam-develop==4.3a2.dev202609030306",
    "ftfy==6.3.1",
    "regex==2026.9.10",]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Merged from upstream VGGT-SLAM's setup.py (name vggt_slam, version 2.0.0), which
# was removed: with a pyproject.toml present, setuptools ignores setup.py entirely,
# so leaving both would silently install no packages at all.
[tool.setuptools.packages.find]
include = ["vggt_slam*", "evals*"]

# torch 2.5.1 has no CUDA 13 build; the cu124 wheels run fine on a CUDA 13.x
# driver via backward compatibility. Do not "fix" this by bumping torch.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv]
prerelease = "allow"
